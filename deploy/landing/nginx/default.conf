# The Argus site and build distribution: one nginx (deploy/landing/README.md).
#
#   /                        landing page: sites/current (a link to the release, switched by
#                            deploy/landing/publish_landing.py)
#   /download                the "Download" button: sends the visitor to the right
#                            file for their system
#   /download/windows|mac    the file for that system; while there is no file, back to the
#                            landing page with an explanation (/?dl=soon)
#   /Argus-*.dmg|zip|exe     the builds themselves (the downloads folder)
#   /latest.json, /latest-mac.json
#                            what counts as the latest version: issued builds update
#                            themselves by these files
#
# Ports 80 and 8080 serve the same thing. 8080 is the former distribution address: it is
# baked into argus.toml ([update] server) of already issued builds, so it must not be
# changed.

# Which system to serve the file for. The rules are checked in order: phones first,
# because their string also contains "Mac OS X". Windows means only 10 and 11 (both have
# "NT 10.0" in the string): the Windows build is for Windows 10 version 2004 and newer,
# and "NT 6.x" (Windows 7 and 8) cannot run it. Mac: the image is for Apple Silicon and
# macOS 14+, but the browser string does not tell this: every Mac in Safari calls itself
# "Intel Mac OS X", and so does the iPad (iPadOS 13+ sends the desktop Safari string
# without the word "iPad"). The landing page tells them apart
# (`navigator.maxTouchPoints`), and so do the captions on the buttons; nginx cannot decide
# this here.
# Request limits per address for the API (accounts, payments, relays): far more than an
# honest person needs, but not enough for password guessing, a flood of registrations and
# connection hogging. The app counts login attempts itself (`server/throttle.py`); that is
# the second line, which comes after this one. The response is 429, as in the app.
limit_req_zone  $binary_remote_addr zone=api_req:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

map $http_user_agent $dl_os {
    default                                 other;
    "~*(iphone|ipad|ipod|android|mobile)"   other;
    "~*windows nt 10"                       windows;
    "~*macintosh"                           mac;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # HTTPS: the same site and the same distribution. The certificate is for arguspilot.com,
    # www and api (certbot, renewal by cron `renew-certs.sh`). For a bare IP the browser will
    # show a name mismatch, and that is as it should be; HTTP on 80 and 8080 stays for already
    # issued builds (the address is baked into their argus.toml).
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/arguspilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arguspilot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ssl:10m;
    ssl_session_timeout 1d;
    server_name _;

    root /usr/share/nginx/sites/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Location without host and port: port 8080 is forwarded to 80 of the container, and
    # otherwise nginx would redirect people from :8080 to :80.
    absolute_redirect off;
    sendfile_max_chunk 512k;

    # The main page weighs 1.4 MB, and the link to the server can be slow: a compressed
    # response is 4-5 times shorter.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript image/svg+xml;

    include /etc/nginx/conf.d/security.inc;

    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-cache" always;
    }

    # "/404" without .html would otherwise find this same page and answer with it with code 200.
    location = /404 {
        return 404;
    }

    # Issuing and renewing the certificate (certbot, check over HTTP): we serve only its probe
    # files.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/acme;
        default_type text/plain;
    }

    # Hidden files and directories are never served (.well-known is left for certificate
    # issuing).
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # --- "Download" buttons ---------------------------------------------------
    # First the system by the browser string, then the file. The response depends on the
    # browser, hence Vary and no cache.
    location = /download {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-store" always;
        add_header Vary "User-Agent" always;
        return 302 /download/$dl_os;
    }

    location = /download/windows {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-store" always;
        if (-f /usr/share/nginx/downloads/Argus-win.zip) {
            return 302 /Argus-win.zip;
        }
        return 302 /?dl=soon;
    }

    location = /download/mac {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-store" always;
        if (-f /usr/share/nginx/downloads/Argus-mac.dmg) {
            return 302 /Argus-mac.dmg;
        }
        return 302 /?dl=soon;
    }

    # Phone, Linux and everything else: there is no app for them, the landing page will show
    # an explanation.
    location = /download/other {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-store" always;
        return 302 /?dl=other;
    }

    # --- the builds themselves and version files (the downloads folder) ---------------------
    location ~ ^/(?<build>Argus-[A-Za-z0-9._-]+\.(?:dmg|zip|exe|msi))$ {
        root /usr/share/nginx/downloads;
        include /etc/nginx/conf.d/security.inc;
        add_header Content-Disposition 'attachment; filename="$build"' always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location ~ ^/latest(?:-mac)?\.json$ {
        root /usr/share/nginx/downloads;
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-cache" always;
    }

    # --- landing page ---------------------------------------------------------------------
    # Pages and frames are always revalidated with the server (ETag, a 304 is cheap): an edit
    # is visible right after the page is refreshed.
    location / {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri $uri.html $uri/ =404;
    }
}

# --- Domain arguspilot.com: the site is OPEN (2026-10-16) ------------------------------
# Until that day the landing page on the domain was closed; on 2026-10-16 the payment
# provider's moderation wrote "the site does not work", so the site is open. All pages,
# including /terms and /privacy, come from the landing page `sites/current` (with the
# header, menu and language picker; requirement: these pages must have the top menu and
# the language picker). To close it again: put `return 404;` back into the domain's
# `location /` (and remove the three blocks above it: the 404 page and the /download
# buttons).
server {
    listen 80;
    listen [::]:80;
    server_name arguspilot.com www.arguspilot.com api.arguspilot.com;
    server_tokens off;

    # Certificate renewal goes over HTTP, everything else over HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arguspilot.com www.arguspilot.com;
    server_tokens off;

    # The site on the domain is OPEN (2026-10-16: the payment provider's moderation answered
    # "the site does not work", so a live site is needed). The same landing page, "Download"
    # buttons and pages as on the IP address; it is hidden from search engines by a
    # noindex header until decided otherwise.
    root /usr/share/nginx/sites/current;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    sendfile_max_chunk 512k;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript image/svg+xml;

    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-cache" always;
    }
    location = /404 {
        return 404;
    }

    ssl_certificate     /etc/letsencrypt/live/arguspilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arguspilot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ssl:10m;
    ssl_session_timeout 1d;

    # Hidden files and directories are never served (as on the IP address): `.manifest.sha256`
    # sits in the landing page release.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ~ ^/(?<build>Argus-[A-Za-z0-9._-]+\.(?:dmg|zip|exe|msi))$ {
        root /usr/share/nginx/downloads;
        include /etc/nginx/conf.d/security.inc;
        add_header Content-Disposition 'attachment; filename="$build"' always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location ~ ^/latest(?:-mac)?\.json$ {
        root /usr/share/nginx/downloads;
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # --- "Download" buttons: lead to the right file by the visitor's system ---
    # (same as on the IP address above)
    location = /download {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-store" always;
        add_header Vary "User-Agent" always;
        return 302 /download/$dl_os;
    }

    location = /download/windows {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-store" always;
        if (-f /usr/share/nginx/downloads/Argus-win.zip) {
            return 302 /Argus-win.zip;
        }
        return 302 /?dl=soon;
    }

    location = /download/mac {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-store" always;
        if (-f /usr/share/nginx/downloads/Argus-mac.dmg) {
            return 302 /Argus-mac.dmg;
        }
        return 302 /?dl=soon;
    }

    location = /download/other {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-store" always;
        return 302 /?dl=other;
    }

    # Seller details: a temporary page (posted on 2026-10-16 for the payment provider's check
    # and to be removed after it; to remove it, follow the "Seller details" section of
    # `deploy/landing/README.md`). Not cached, not indexed, and not kept in search engine
    # caches.
    location ~ ^/seller(?:\.html)?$ {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, noarchive, nosnippet" always;
        try_files /seller.html =404;
    }

    # --- the site itself: landing page, pricing, help (sites/current) ------------------------
    location / {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri $uri.html $uri/ =404;
    }
}

# --- API (accounts, payments, relays for replies, voice-over and recognition) ------------
# https://api.arguspilot.com -> the argus-server:8421 container in the same network. The
# WebSocket (/relay/stt) goes through Upgrade.
# The old address http://203.0.113.10:8421 stays (it is baked into issued builds): it is
# now also held by nginx (the block below) rather than by the container itself: the same
# limits, the same proxy secret, and the app cannot be reached bypassing them (audit of
# 2026-10-16).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.arguspilot.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/arguspilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arguspilot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 5m;
    include /etc/nginx/conf.d/security.inc;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=api_req burst=60 nodelay;
    limit_conn api_conn 60;

    # A question with materials (up to 42 page images): the server itself accepts a body of up
    # to 24 MiB and only from someone with a genuine pass (`server/limits.py`: BIG_BODY,
    # BIG_PATHS); nginx has a slightly higher cap on this path, and 5m on the others. No
    # buffering: the body streams to the server, and its Content-Length check fires
    # immediately, instead of after nginx has accepted and written to disk up to 25 MB from
    # anybody.
    location = /relay/brain/ask {
        client_max_body_size 25m;
        proxy_request_buffering off;
        include /etc/nginx/conf.d/proxy-secret.inc;
        proxy_pass http://argus-server:8421;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # The proxy secret: the server trusts X-Forwarded-For because of it (ARGUS_PROXY_SECRET in
        # .env); the file is created only on the server (`proxy_set_header X-Argus-Proxy
        # <secret>;`, permissions 600) and does not get into the repository.
        include /etc/nginx/conf.d/proxy-secret.inc;
        proxy_pass http://argus-server:8421;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}


# --- Old API address for issued builds: http://203.0.113.10:8421 ------------------------
# The container itself no longer publishes the port outward (docker-compose.yml): old
# builds come here, to nginx, too. The same limits and the same proxy secret as
# api.arguspilot.com; there is no encryption (HTTP only): new builds go to
# https://api.arguspilot.com.
server {
    listen 8421 default_server;
    listen [::]:8421 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 5m;
    include /etc/nginx/conf.d/security.inc;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=api_req burst=60 nodelay;
    limit_conn api_conn 60;

    location = /relay/brain/ask {
        client_max_body_size 25m;
        proxy_request_buffering off;
        include /etc/nginx/conf.d/proxy-secret.inc;
        proxy_pass http://argus-server:8421;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        include /etc/nginx/conf.d/proxy-secret.inc;
        proxy_pass http://argus-server:8421;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
