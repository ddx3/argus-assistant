<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Argus</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23181a20'/%3E%3Cg transform='translate(5 4.5) scale(.0787)' fill='%23fff'%3E%3Cpath d='M252.5 0H438.5L691 699H517L345.5 127L174 699H0Z'/%3E%3Ccircle cx='345.5' cy='525' r='60'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/chrome.css">
<script src="/chrome.js" defer></script>
<script src="/winbar.js" defer></script>
<script src="/update-button.js" defer></script>
<script src="/account.js"></script>
<style>
  :root {
    --bg:#0a0c10; --panel:#171b21; --sunk:#08090b; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --text:#f2f4f7; --dim:#9aa1ad; --faint:#5b6270;
    /* Small secondary text on cards. `--faint` on a card gives 3.0:1 — below the 4.5:1
       needed for text of this size; this one is 4.8:1 even under the cursor, when the card
       gets lighter. */
    --meta:#868e9b;
    /* The indicator colors are the same as on the dashboard: green for "running", red for
       "error". Buttons and cards are not tinted by them. */
    --accent:#4fb8d8;
    --ok:#5fd68a; --warn:#e0b23e; --bad:#f0716b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 "Segoe UI",system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; }
  .dim { color:var(--dim); }

  /* ---------- header ---------- */
  /* The header shell and the buttons are in /chrome.css, shared with the working screen
     and the settings. The buttons sit on the left, as in the working screen's header;
     there is no program name or page title in the header. */
  .bar { display:flex; align-items:center; gap:12px; padding:9px 12px 9px 0; }  /* flush with the window's left edge (2026-10-07) */
  /* The sign-in line is something without which nothing in the chat will turn on, and it
     is better to learn about it before opening one. We do not write about sound here (see
     `connect` below). */
  .notice { display:flex; align-items:center; gap:12px; padding:8px 18px;
            font-size:13px; color:#ffb8b3; border-top:1px solid var(--slab-edge);
            border-left:3px solid var(--bad); background:var(--slab); }
  .notice[hidden] { display:none; }
  .notice a { color:var(--text); }

  /* ---------- page ---------- */
  main { flex:1; width:100%; max-width:var(--column); margin:0 auto;
         padding:26px var(--pad) 40px; }
  /* There is no "Chats" heading — the page is about them anyway. The button and
     the search stay at the right edge, where they were. */
  .top { display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-bottom:18px; }
  /* "New session": first a gray slab with a border, then bare (it stood
     out from the rest of the style, 2026-10-08), then filled again but without a border
     (a background was requested for this button) — see the rule below. The `.cta` class
     stays — it gives size and feedback, and a test keeps it on the button. */
  main[hidden] { display:none; }

  /* A sign-in screen in place of the list (2026-10-08): when not signed in, the home page
     shows the sign-in screen at full size, since the app cannot be used without signing
     in anyway. The form is drawn by the same `account.js` as the "Account"
     tab — there is no copy of the markup; here there is only a place for it and the mark
     with the name. */
  .gate { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate[hidden] { display:none; }
  .gate-inner { width:100%; max-width:340px; display:flex; flex-direction:column; gap:28px; margin-bottom:6vh; }
  /* The name is a merged mark: the letter "A" without a crossbar but with a dot, and then
     "rgus" in the typeface (2026-10-08: the logo is set into the name using the font).
     The mark replaces the first letter instead of sitting next to the name — otherwise it
     came out as "A Argus". The same rules as the name on the landing page (`.wm`): bold
     Segoe UI, the mark is as tall as a capital letter (.7em) and sits on the line's
     baseline, and the mark's outline is traced from Segoe UI Bold, so it is level with
     the following letters. */
  .gate-brand { display:flex; justify-content:center; font-size:44px; font-weight:700; line-height:1;
                letter-spacing:-.01em; }
  .gate-brand .wm { display:inline-flex; align-items:baseline; }
  .gate-brand .wm svg { width:auto; height:.7em; aspect-ratio:691/699; margin-right:.01em; fill:currentColor; flex:none; }
  .gate-box .ac-auth { margin:0 auto; }
  .gate.busy .gate-box { visibility:hidden; }   /* signed in: until the state is checked, we do not flash the account tab */

  /* Filled, like the buttons of the sign-in form (2026-10-08: a background was requested
     for this button): a gray slab without an outline, lighter on hover. It used to be
     bare, with a fill only under the cursor. */
  #new-chat { background:rgba(255,255,255,.055); border-color:transparent; }
  #new-chat:hover:not(:disabled), #new-chat:active:not(:disabled) { background:var(--btn-hover); border-color:transparent; }
  /* Search by name — across the full width of the row up to the "New session"
     button (2026-10-12: an input field for sessions by name); always visible
     when there is at least one session. */
  /* The search uses the page colors and has no edge, like the fields in windows (the
     "flat look" in chrome.css); the edge shows only when the field has focus. Same height
     as the button next to it. */
  #filter { background:var(--field-fill); color:var(--text); border:1px solid var(--field-edge);
            border-radius:var(--field-r); padding:0 12px; font:inherit; flex:1; min-width:0; height:var(--field-h);
            transition:border-color .12s; }
  #new-chat { flex:none; }
  #filter:focus { outline:none; border-color:var(--glass-edge-top); }
  #filter::placeholder { color:var(--dim); }
  #filter[hidden] { display:none; }
  /* "New session" is the main button of the page: the shared `.cta`
     (chrome.css), with no rules of its own. The "+" icon and the label sit in a row; the
     gap and the icon size are `.cta`'s too. */

  /* ---------- sessions: a flat list by day, like "Your activity" in Cluely ---------- */
  /* No tiles or borders: the name, small labels next to it, the time on the right. Days
     are quiet headings with a thin line; a row lightens only under the cursor. We do not
     pull the conversation description into the row — it is in the hint for the name, and
     the name is generated from it anyway. */
  .list { display:flex; flex-direction:column; }
  .day { margin:28px 0 6px; padding:0 14px 9px; font-size:12.5px; font-weight:600; color:var(--dim);
         border-bottom:1px solid var(--slab-edge); }
  .day:first-child { margin-top:0; }
  .chat { position:relative; display:flex; align-items:center; gap:12px; min-height:46px;
          padding:9px 14px; cursor:pointer; text-align:left; border-radius:8px;
          transition:background .12s; }
  .chat:hover, .chat:focus-within { background:var(--btn-hover); }
  .chat.opening { opacity:.55; pointer-events:none; }
  /* The name is a real link stretched over the whole row: it opens with a click anywhere,
     from the keyboard (Tab, Enter) and with the middle button, while the action buttons
     lie on top of it and remain separate buttons. Buttons cannot be nested inside a link
     row: a screen reader would not know what to press. */
  .chat .name { margin:0; min-width:0; font-size:15px; font-weight:500; }
  .chat .open { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
                color:inherit; text-decoration:none; }
  .chat .open::after { content:""; position:absolute; inset:0; border-radius:8px; }
  .chat .open:focus-visible { outline:none; }
  .chat:has(.open:focus-visible) { outline:2px solid var(--focus); outline-offset:-2px; }
  .when { flex:none; width:44px; text-align:right; color:var(--meta); font-size:13px;
          font-variant-numeric:tabular-nums; }

  /* Session actions sit between the name and the time, visible on hover and with Tab.
     While there is no mouse, the row stays clean: renaming or deleting is needed once a
     week, opening every day. There are no labels or counters in the row: the name, the
     time, and that is all. */
  .tools { position:relative; z-index:1; flex:none; display:flex; gap:6px; margin-left:auto;
           opacity:0; transition:opacity .12s; }
  .chat:hover .tools, .chat:focus-within .tools { opacity:1; }
  .tools .iconbtn { width:26px; height:26px; }
  .tools .iconbtn.danger:hover:not(:disabled) svg { stroke:var(--bad); }

  /* A very narrow window: the row goes on two levels — name and time, with the buttons
     under them. Down to 380px the row stays on one line: the name shrinks, and the
     buttons and the time do not drop down (2026-10-12: why is everything for one chat on
     two lines). */
  @media (max-width: 380px) {
    .chat { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:4px 10px;
            padding:10px 12px 8px; }
    .chat .name { grid-column:1; grid-row:1; }
    .chat .when { grid-column:2; grid-row:1; width:auto; }
    .chat .tools { grid-column:2; grid-row:2; margin-left:0; }
  }

  .empty { max-width:460px; margin:11vh auto 0; text-align:center; }
  .empty h2 { margin:0 0 8px; font-size:17px; font-weight:600; }
  .empty p { margin:0 0 20px; color:var(--dim); }
  .empty[hidden], .list[hidden] { display:none; }
  .nothing { color:var(--dim); padding:30px 0; text-align:center; }
  .nothing[hidden] { display:none; }

  /* ---------- question window: title, rename, delete ---------- */
  .scrim2 { position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:20px;
            background:rgba(4,5,6,.72); }
  .scrim2[hidden] { display:none; }
  /* Solid, in the `--win` color (chrome.css, darker than before), like the other windows.
     Flat look: `.dialog` is in the list of windows in chrome.css, where the field fill
     and edge are also set (`--input-fill`, `--input-edge`). "Cancel" and
     "Skip" are bare buttons (`.ghost`), "Create" is the main one
     (`.cta`); the buttons have no edge. */
  .dialog { width:min(440px, 100%); padding:20px 20px 18px; background:var(--win);
            border:1px solid var(--win-edge); border-radius:14px;
            box-shadow:0 24px 60px -20px #000; }
  .dialog h3 { margin:0 0 4px; font-size:15px; font-weight:600; }
  .dialog p { margin:0 0 14px; color:var(--dim); font-size:13px; }
  .dialog p b { color:var(--text); font-weight:600; }
  /* The field has the same color as the window (requirement, 2026-10-07: the input field
     background matches the window): the border comes only from the edge on focus, and in
     the dialog the field is focused from the very start. */
  .dialog input { width:100%; height:var(--field-h); margin:8px 0 16px; padding:0 12px; font:inherit;
                  color:var(--text); background:var(--field-fill); border:1px solid var(--field-edge);
                  border-radius:var(--field-r); transition:border-color .12s; }
  .dialog input:focus { outline:none; border-color:var(--glass-edge-top); }
  .dialog input::placeholder { color:var(--dim); }
  .dialog .err { color:var(--bad); font-size:12.5px; margin:-8px 0 12px; }
  .dialog .err[hidden] { display:none; }
  .dialog .row { display:flex; justify-content:flex-end; gap:6px; }
  /* A dangerous action ("Delete") is shown as red text, not as a fill: the
     buttons stay gray. `.cta.danger` in chrome.css already colors it that way; here
     `ask()` attaches the class. */
</style>

</head>
<body>

<header>
  <div class="bar">
    <!-- The same button as on the working screen: `chrome.js` finds it by `id`. The settings
         here are global (`data-settings-scope` on `<body>`, below): there is nothing to
         configure for "this chat" while we are not in any chat. Account is a tab of the same
         window; there is no person button in the header any more (2026-10-07). -->
    <button class="iconbtn hdr-btn" id="settings-btn" type="button"
            aria-label="Settings" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
    </button>
  </div>
  <div class="notice" id="notice" role="status" hidden><span id="notice-text"></span></div>
</header>

<main>
  <div class="top">
    <input type="text" id="filter" placeholder="Find a session" aria-label="Find a session" hidden>
    <button id="new-chat" class="cta" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New session
    </button>
  </div>

  <div class="list" id="list" hidden></div>
  <div class="nothing" id="nothing" hidden>Nothing found</div>
  <div class="nothing" id="failed" role="alert" hidden>Couldn't load the sessions. Trying again…</div>

  <div class="empty" id="empty" hidden>
    <h2>No sessions yet</h2>
    <p>A session is one conversation, with its own settings, materials, and answer history. Create a separate session for an interview, an exam, or a work call, so they don't get in each other's way.</p>
    <button id="empty-new" class="cta" type="button">New session</button>
  </div>
</main>

<section class="gate" id="gate" hidden aria-label="Login">
  <div class="gate-inner">
    <div class="gate-brand">
      <span class="wm" role="img" aria-label="Argus" data-i18n="off"><svg viewBox="0 0 691 699" aria-hidden="true"><path d="M252.5 0H438.5L691 699H517L345.5 127L174 699H0Z"/><circle cx="345.5" cy="525" r="60"/></svg><span aria-hidden="true">rgus</span></span>
    </div>
    <div id="gate-slot"></div>
  </div>
</section>

<div class="scrim2" id="dialog" hidden>
  <form class="dialog" id="dialog-form" autocomplete="off" role="dialog" aria-modal="true"
        aria-labelledby="dialog-title">
    <h3 id="dialog-title"></h3>
    <p id="dialog-text" hidden></p>
    <input type="text" id="dialog-input" maxlength="80">
    <div class="err" id="dialog-err" hidden></div>
    <div class="row">
      <button type="button" id="dialog-cancel" class="ghost">Cancel</button>
      <button type="button" id="dialog-skip" class="ghost" hidden>Skip</button>
      <button type="submit" id="dialog-ok" class="cta">Done</button>
    </div>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x ?? "").replace(/[&<>"]/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// Settings on the home page are global only: we are not in any chat right now.
// `admin.js` reads this when it mounts the panel.
document.body.dataset.settingsScope = "app";

let chats = [];          // the last list from the server
let running = false;     // whether recognition is running (in the chat that is open right now)

// --- time ---
// The list is split by day, so a row has only hours and minutes, and the day is in the
// group heading: "Today", "Yesterday", "Mon, 5 Oct",
// "Mon, 5 Oct 2025". Days and months are named by `Intl` according to
// the page language (`window.ARGUS_LANG`); "Today" and "Yesterday" go through `argusT`:
// the English "Mon, 5 Oct" assembled here in code could not be translated by any
// dictionary, and in every language the dates stayed English. Without the translation
// engine (English) there is no `argusT`, and the string stays as it is.
const T = (s) => (window.argusT ? window.argusT(s) : s);
const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
function clock(ts) {
  const d = new Date(ts * 1000);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function dayLabel(ts) {
  const d = new Date(ts * 1000), now = new Date();
  const gap = Math.round((dayStart(now) - dayStart(d)) / 86400000);
  if (gap === 0) return T("Today");
  if (gap === 1) return T("Yesterday");
  const text = new Intl.DateTimeFormat(window.ARGUS_LANG || "en", {
    weekday: "short", day: "numeric", month: "short",
    ...(d.getFullYear() === now.getFullYear() ? {} : { year: "numeric" }),
  }).format(d);
  return text[0].toUpperCase() + text.slice(1);
}
// The name for display. A session without a generated name stores the service name
// "New session" (`chats/manager.py`: `DEFAULT_NAME`, with a number when
// the name is taken): we show it in the page language and leave real names alone.
function chatName(c) {
  const m = c.unnamed && /^New session( \d+)?$/.exec(c.name || "");
  return m ? T("New session") + (m[1] || "") : c.name;
}

// --- list ---
const ICONS = {
  record: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
  settings: '<path d="M4 6h8M18 6h2M4 12h12M20 12h0M4 18h5M15 18h5"/><circle cx="14" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="11" cy="18" r="2"/>',
  rename: '<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  del: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
};
const tool = (act, title, extra = "") =>
  `<button type="button" class="iconbtn ${extra}" data-act="${act}" aria-label="${title}">` +
  `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[act]}</svg></button>`;

// A session row. The conversation description is not shown in it.
function cardHTML(c) {
  return `
    <div class="chat" data-id="${esc(c.id)}">
      <h3 class="name"><a class="open" href="/chat/${encodeURIComponent(c.id)}" data-i18n="off">${esc(chatName(c))}</a></h3>
      <div class="tools">
        ${tool("record", "Work with the recording")}${tool("settings", "Session settings")}${tool("rename", "Rename")}${tool("del", "Delete", "danger")}
      </div>
      <time class="when">${clock(c.updated)}</time>
    </div>`;
}

// Newest first, by day: the day heading goes before the first row that falls into it.
function listHTML(items) {
  let html = "", last = null;
  for (const c of [...items].sort((a, b) => b.updated - a.updated)) {
    const day = dayStart(new Date(c.updated * 1000));
    if (day !== last) { html += `<h2 class="day">${dayLabel(c.updated)}</h2>`; last = day; }
    html += cardHTML(c);
  }
  return html;
}

function draw() {
  // The word from the search field applies only while the field itself is visible: the
  // field is hidden when there are no sessions at all, and an invisible filter would
  // hide sessions without any explanation.
  const q = chats.length ? $("filter").value.trim().toLowerCase() : "";
  const shown = q
    ? chats.filter(c => (chatName(c) || "").toLowerCase().includes(q))
    : chats;
  $("filter").hidden = chats.length === 0;
  $("empty").hidden = chats.length > 0;
  $("new-chat").hidden = chats.length === 0;
  $("list").hidden = shown.length === 0;
  $("nothing").hidden = !(chats.length && !shown.length);
  $("list").innerHTML = listHTML(shown);
}

let retry = 0;
async function load() {
  clearTimeout(retry);
  try {
    const r = await (await fetch("/chats")).json();
    if (!Array.isArray(r.chats)) throw new Error("not a list");
    chats = r.chats;
    running = !!r.running;
    $("failed").hidden = true;
    draw();
  } catch {
    // The server is still starting or answered with an error. An empty page with no words
    // would read as "no chats" — we say what is going on and try again.
    $("failed").hidden = false;
    $("empty").hidden = true;
    retry = setTimeout(load, 3000);
  }
}

// --- open a chat ---
// The chat page opens it itself, on the server (`/chat/<id>`), so it is enough to
// navigate here. There is one exception: running recognition. Another chat will switch
// it off (it is paid and does not move into someone else's conversation), and it is
// easy to miss the card in the middle of a call. In that case we ask again.
async function openChat(id, suffix = "") {
  const current = chats.find(c => c.active);
  if (running && current && current.id !== id) {
    const go = await ask({
      title: "Stop recognition?",
      text: `Recognition is running in the session “<b data-i18n="off">${esc(chatName(current))}</b>”. ` +
            `If you open another session, it will stop.`,
      ok: "Stop and open", action: async () => null,
    });
    if (!go) return;
  }
  // "Opening…" is for when the materials are large and parsing takes
  // seconds: the click must be visible at once.
  const card = document.querySelector(`.chat[data-id="${CSS.escape(id)}"]`);
  if (card) card.classList.add("opening");
  location.href = `/chat/${encodeURIComponent(id)}${suffix}`;
}

// "Work with the recording" is the screen with the text of an
// already recorded conversation (`/chat/<id>/record`). It does not open the session and
// does not touch recognition: the recording can be read while a call is going on in
// another session — so there is nothing to ask again, as in `openChat`.
function openRecord(id) {
  const card = document.querySelector(`.chat[data-id="${CSS.escape(id)}"]`);
  if (card) card.classList.add("opening");
  location.href = `/chat/${encodeURIComponent(id)}/record`;
}

// --- question window ---
// `action` receives the entered value and does the work; if it returns text, that is
// the reason for the refusal, and the window stays open with it instead of closing
// silently. If it returns `null`, the work is done. This way "the name is empty" or
// "the server did not answer" is visible where the person has just clicked.
let dialogCancel = null;
function ask({ title, text = "", value = null, ok = "Done", danger = false,
               placeholder = "", skip = false, action }) {
  return new Promise((resolve) => {
    $("dialog-title").textContent = title;
    const p = $("dialog-text");
    p.hidden = !text;
    p.innerHTML = text;
    const input = $("dialog-input");
    input.hidden = value === null;
    input.value = value ?? "";
    input.placeholder = placeholder;
    $("dialog-err").hidden = true;
    const okBtn = $("dialog-ok");
    okBtn.textContent = ok;
    okBtn.disabled = false;
    // "Skip" is the same action with an empty value: this way the person
    // starts at once, and the name is generated later by itself (`ChatManager._auto_name`).
    // It is shown only where the name may be left out.
    const skipBtn = $("dialog-skip");
    skipBtn.hidden = !skip;
    skipBtn.disabled = false;
    skipBtn.onclick = () => { input.value = ""; $("dialog-form").requestSubmit(); };
    okBtn.classList.toggle("danger", danger);
    // Where to return focus when the window closes: the person pressed a card or a button,
    // and from the keyboard they need to end up in the same place.
    const opener = document.activeElement;
    $("dialog").hidden = false;
    (value === null ? okBtn : input).focus();
    if (value !== null) input.select();

    // The window closes once, and while an action is running (rename, delete, create) it
    // cannot be cancelled: the action will reach the server anyway, and the page would
    // decide that nothing happened and keep the old list (a deleted session would hang in
    // it until a refresh). A late answer must also not close a different window that is
    // already open.
    let closed = false, pending = false;
    const cancelBtn = $("dialog-cancel");
    const close = (done) => {
      if (closed) return;
      closed = true;
      $("dialog").hidden = true;
      $("dialog-form").onsubmit = null;
      dialogCancel = null;
      if (opener && opener.isConnected) opener.focus();
      resolve(done);
    };
    dialogCancel = () => { if (!pending) close(false); };
    cancelBtn.disabled = false;
    $("dialog-form").onsubmit = async (e) => {
      e.preventDefault();
      if (pending) return;
      pending = true;
      okBtn.disabled = skipBtn.disabled = cancelBtn.disabled = true;
      let failure = null;
      try { failure = await action(input.value); }
      catch { failure = "That didn't work. Try again."; }
      pending = false;
      okBtn.disabled = skipBtn.disabled = cancelBtn.disabled = false;
      if (failure) { $("dialog-err").textContent = failure; $("dialog-err").hidden = false; return; }
      close(true);
    };
  });
}
// Tab cycles inside the window: the page under it is dimmed and there is nothing to
// press in it, and focus that went under the scrim would look lost.
$("dialog-form").addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const items = [...$("dialog-form").querySelectorAll("input, button")]
    .filter(el => !el.hidden && !el.disabled);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
$("dialog-cancel").onclick = () => dialogCancel?.();
$("dialog").addEventListener("mousedown", (e) => { if (e.target === $("dialog")) dialogCancel?.(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") dialogCancel?.(); });

async function api(method, path, body) {
  const r = await fetch(path, {
    method, headers: { "Content-Type": "application/json" },
    // A POST always has a body, even an empty `{}`: that is how the local server accepts it
    // (protection against foreign pages).
    body: body ? JSON.stringify(body) : (method === "POST" ? "{}" : undefined),
  });
  return r.json();
}

// --- actions ---
async function newChat() {
  let made = null;
  await ask({
    title: "New session", value: "", ok: "Create", skip: true,
    text: "You can leave the name empty: it will be picked from what the conversation is about.",
    placeholder: "For example: interview at Google",
    action: async (name) => {
      const r = await api("POST", "/chats", { name });
      if (!r.ok) return r.error || "Couldn't create the session";
      made = r.chat;
      return null;
    },
  });
  // A new chat opens at once and straight on its settings: empty, with no context, it is
  // useless, and the person came to fill it in.
  if (made) { load(); openChat(made.id, "#admin"); }
}

async function rename(c) {
  const done = await ask({
    title: "Rename session", value: c.name, ok: "Save",
    action: async (name) => {
      const r = await api("PATCH", `/chats/${c.id}`, { name });
      return r.ok ? null : (r.error || "Couldn't rename it");
    },
  });
  if (done) await load();
}

async function remove(c) {
  const done = await ask({
    title: "Delete the session?",
    text: `“<b data-i18n="off">${esc(chatName(c))}</b>” will be deleted along with its answer history and its own materials. ` +
          `This can't be undone.`,
    ok: "Delete", danger: true,
    action: async () => {
      const r = await api("DELETE", `/chats/${c.id}`);
      return r.ok === false ? (r.error || "Couldn't delete it") : null;
    },
  });
  if (done) await load();
}

// --- events ---
$("list").addEventListener("click", (e) => {
  const card = e.target.closest(".chat");
  if (!card) return;
  const c = chats.find(x => x.id === card.dataset.id);
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!c) return;
  // Always through `openChat`, with Ctrl/Shift too: following the link is a request to
  // the server that opens the session and stops paid recognition in the previous one,
  // and the browser (the system one in the app window) would do it bypassing the
  // "Stop recognition?" question. The app has no "open in a
  // new tab" windows.
  e.preventDefault();
  if (act === "record") openRecord(c.id);
  else if (act === "settings") openChat(c.id, "#admin");
  else if (act === "rename") rename(c);
  else if (act === "del") remove(c);
  else openChat(c.id);
});
// The middle button on the name is also an "open in a new window" link: it is not a
// `click` but an `auxclick`, and it has to be taken away separately.
$("list").addEventListener("auxclick", (e) => { if (e.target.closest("a.open")) e.preventDefault(); });
$("new-chat").onclick = newChat;
$("empty-new").onclick = newChat;
$("filter").addEventListener("input", draw);

// --- account sign-in ---
// The same snapshot that feeds the working screen. From it we take only `account_hint`:
// complaints about sound ("the pinned microphone was not found — listening to
// another one") are about recognition,
// which is switched on inside a chat, where the same complaint already stands next to
// the "Reconnect audio" button. On the chat list they would only
// be an eyesore.
// While the sign-in screen is shown, the "you need to sign in — it's in settings"
// banner stays silent (requirement, 2026-10-08:
// do not show it until we are signed in): the sign-in form is already in front of the
// eyes, and the banner would send people to the settings for something that is
// already here. We remember the text and restore it when the sign-in closes.
let noticeText = "";
let gateOn = false;
// On the sign-in screen the top strip has only the window buttons — minimize, windowed
// mode, close (requirement, 2026-10-08: only three buttons at the top): there is no
// gear, because settings are not needed before sign-in, and the sign-in is on screen
// anyway.
let lastAdmin = false;
function syncGear() { $("settings-btn").hidden = gateOn || !(lastAdmin || window.argusAccount); }
function setNotice(text) {
  noticeText = text || "";
  $("notice-text").textContent = noticeText;
  $("notice").hidden = !noticeText || gateOn;
}
let ws;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (m) => {
    const s = JSON.parse(m.data);
    // The settings button is also the way into the account: there is no separate account
    // button, so with admin switched off it stays as long as there is a way to open the
    // "Account" tab.
    lastAdmin = !!s.admin;
    syncGear();
    if (running !== !!s.controls?.running) { running = !!s.controls?.running; draw(); }
    setNotice(s.account_hint || "");
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();

// Account: signing in and buying can remove the reason why recognition would not switch
// on — we remove the hint at once, without waiting for the next snapshot.
window.argusAccountHooks = {
  toast: (text) => setNotice(text),
  onChange: () => { setNotice(""); checkGate(); },
};

// --- sign-in instead of the list ---
// The app cannot be used without signing in (recognition and answers go through the
// account), so instead of the session list there is a full-page sign-in screen. We lock
// only when the account server has answered directly "not signed in"
// (`signed_in: false`): a build on own keys, disabled admin and no connection lock
// nothing. The list is visible at once and the check follows it — a signed-in person
// has no reason to wait for the network.
async function checkGate() {
  if (!window.argusAccount) return;
  let st = null;
  try { st = await (await fetch("/admin/account", { cache: "no-store" })).json(); } catch (e) { /* no connection — we do not lock */ }
  if (gateOn && st && st.signed_in === false) { $("gate").classList.remove("busy"); return; }   // still not signed in
  setGate(!!st && st.signed_in === false);
}
function setGate(on) {
  if (on === gateOn) return;
  gateOn = on;
  syncGear();
  $("notice").hidden = !noticeText || gateOn;
  $("gate").hidden = !on;
  $("gate").classList.remove("busy");
  document.querySelector("main").hidden = on;
  if (on) {
    const box = document.createElement("div");      // a new one each time: the previous form remembers the earlier sign-in
    box.className = "gate-box";
    $("gate-slot").replaceChildren(box);
    window.argusAccount.mount(box, {
      toast: (text) => setNotice(text),
      // Signed in — hide the form at once without waiting for the answer: otherwise it would
      // manage to redraw into the account view.
      onChange: () => { $("gate").classList.add("busy"); checkGate(); },
    });
    if (window.argusWin) window.argusWin.close();   // a settings window opened on "Account" is not needed: the sign-in is already
                                                    // on screen
  } else {
    $("gate-slot").replaceChildren();
    load();
  }
}
checkGate();

// Came back to the tab or via the "back" button — the list may have changed (another
// window, another tab, a chat was just deleted or changed).
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
window.addEventListener("pageshow", (e) => { if (e.persisted) load(); });
load();
</script>
</body>
</html>
